[project]
name = "channel-lens"
version = "0.1.0"
description = "Local YouTube strategy workbench: outlier detection, competitor tracking, thumbnail and title analysis, and your own channel's real CTR/retention."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dateutil>=2.9",
    # Windows ships no IANA tz database, and quota resets on a Pacific day
    # boundary that we must compute correctly regardless of local timezone.
    "tzdata>=2024.1; sys_platform == 'win32'",
    "numpy>=1.26",
    "pillow>=10.4",
    "apscheduler>=3.10",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
channel-lens = "channel_lens.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/channel_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules"
asyncio_mode = "auto"
